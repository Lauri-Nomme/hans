[package]
name = "bb-obj-tar"
version = "0.1.0"
edition = "2021"
description = "Stream a git repo's objects into a Bitbucket-format loose-object tar (byte-identical to git unpack-objects)"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true